name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Validate ESP32 configuration
        run: uv run esphome config example-esp32.yaml

      - name: Validate ESP8266 configuration
        run: uv run esphome config example-esp8266.yaml

  compile:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - example-esp32.yaml
          - example-esp8266.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile firmware
        run: uv run esphome compile ${{ matrix.config }}
